<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bearly Invested — the stock market, explained by a bear</title>
  <meta name="description" content="Bearly Invested is a friendly, beginner-focused stock market app. A bear mascot explains the market in plain English." />
  <meta name="robots" content="index,follow" />
  <!-- Open Graph / social preview — fill in a real preview image when the landing page ships -->
  <meta property="og:title" content="Bearly Invested" />
  <meta property="og:description" content="The stock market, explained by a bear." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://bearlyinvested.app/" />
  <style>
    :root { color-scheme: light dark; --green: #16a34a; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; min-height: 100vh; margin: 0; align-items: center; justify-content: center;
      color: #1a1a1a; background: #ffffff; text-align: center; padding: 24px;
    }
    main { max-width: 520px; }
    .logo { font-size: 44px; margin-bottom: 12px; }
    .brand { font-weight: 700; font-size: 30px; margin-bottom: 8px; }
    .brand span { color: var(--green); }
    .tagline { color: #666; font-size: 17px; margin: 4px 0 24px; }
    .links a { color: var(--green); margin: 0 10px; font-weight: 600; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
    footer { margin-top: 40px; font-size: 13px; color: #999; }
    @media (prefers-color-scheme: dark) {
      body { color: #e6e6e6; background: #0f0f10; }
      .tagline { color: #9a9a9a; }
      footer { color: #6a6a6a; }
    }
  </style>
</head>
<body>
  <!--
    ============================================================================
    Apex landing page — https://bearlyinvested.app/
    This is currently a minimal placeholder that also serves the required legal
    links. When the real marketing landing page is built, grow it HERE (hero,
    screenshots, App Store / Play Store badges, feature sections, etc.). Keep the
    /privacy and /terms links reachable from the footer — the app, the stores,
    and Google OAuth all depend on those URLs staying live.
    ============================================================================
  -->
  <main>
    <div class="logo">🐻</div>
    <div class="brand">Bearly <span>Invested</span></div>
    <p class="tagline">The stock market, explained by a bear.</p>
    <div class="links">
      <a href="/privacy">Privacy Policy</a>
      <a href="/terms">Terms of Service</a>
    </div>
    <footer>© 2026 Bearly Invested · Coming soon to iOS &amp; Android</footer>
  </main>
</body>
</html>
